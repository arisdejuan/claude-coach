<main id="app"><p class="muted" style="text-align:center;margin-top:30vh">Cargando…</p></main>
<nav id="nav" class="hidden"><div class="in">
  <button data-tab="hoy" class="on"><i>⚡</i>Hoy</button>
  <button data-tab="semana"><i>📅</i>Semana</button>
  <button data-tab="movilidad"><i>🧘</i>Movilidad</button>
  <button data-tab="progreso"><i>📈</i>Progreso</button>
  <button data-tab="info"><i>ℹ️</i>Info</button>
</div></nav>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script>
/* =====================================================================
   CLAUDE COACH · dashboard
   Datos en Supabase (login). Oura y Strava llegan solos (GitHub Actions).
   ===================================================================== */

/* ---------- utilidades ---------- */
const r25 = x => Math.round(x/2.5)*2.5;
const fmtKg = v => String(v).replace(".",",");
const num = v => { if(v==null||v==="") return null; const s=String(v); if(/[×x+*]/i.test(s)) return null;
  const n=parseFloat(s.replace(",",".")); return isNaN(n)?null:n; };
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const masDias = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const hm = s => { const h=Math.floor(s/3600), m=Math.round(s%3600/60); return h?`${h} h ${String(m).padStart(2,"0")}'`:`${m}'`; };

/* ---------- calendario ---------- */
const HOYD = new Date(); HOYD.setHours(0,0,0,0);
const HOY = (HOYD.getDay()+6)%7;                 // 0 = lunes
const LUNES = masDias(HOYD,-HOY);
const SEMKEY = iso(LUNES);
const DIAS = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const fecha = i => masDias(LUNES,i);

/* ---------- perfil (se sobrescribe con el de la base de datos) ---------- */
let A = {
  nombre:"", ftp:250, peso:null, pesoObj:null, fc_umbral:170,
  rm:{ sentadilla:100, pesoMuerto:120, press:50 },
  reto:{ nombre:"", fecha:null },
  objetivos:{ ftp:null, sentadilla:null, pesoMuerto:null, press:null },
  bloques:[["Base + fuerza","2026-11-16","nov-dic"],["Construcción","2027-01-04","ene-feb"],
           ["Específico","2027-02-15","feb-abr"],["Afinado","2027-04-10","abr"]]
};
// Plan propio guardado en el perfil (atletas con «solo fuerza» dados de alta con su Claude)
const PROPIO = () => !!(A.plan && A.plan.sesiones);
function bloque(){ return bloqueDe(LUNES); }
// Ciclos de 3 semanas de carga + 1 de descarga. Una semana con 3+ días fuera (viaje, vacaciones…) cuenta como
// descarga y reinicia el ciclo; si la descarga toca justo antes de una semana fuera, se aplaza para que coincidan.
function bloqueDe(Lu){
  const B=A.bloques, K=iso(Lu); let b=0; B.forEach((x,k)=>{ if(K>=x[1]) b=k; });
  const ini=new Date(B[b][1]+"T00:00:00");
  const sem=Math.max(1,Math.floor((Lu-ini)/(7*864e5))+1);
  let c=0, res={descarga:false, ciclo:1, ausente:false};
  for(let W=new Date(ini); W<=Lu; W=masDias(W,7)){
    const aus=semanaFuera(W); let desc=false;
    if(aus){ desc=true; c=0; }
    else { c++; if(c>=4 && !semanaFuera(masDias(W,7))){ desc=true; c=0; } }
    res={descarga:desc, ciclo:desc?0:c, ausente:aus};
  }
  return {k:b, nombre:B[b][0], sem, ...res};
}
/* ---------- viajes, vacaciones y días fuera (perfil.ausencias) ---------- */
const AUS={ gym:["🧳","Viaje con gimnasio"], nada:["🏨","Viaje sin gimnasio"], vacas:["🏖","Vacaciones / descanso"], esqui:["⛷","Esquí"], enfermo:["🤒","Enfermo"] };
const ausenciaDe = f => (A.ausencias||[]).find(x=>x.desde<=f && f<=x.hasta) || null;
function semanaFuera(L){ let n=0; for(let d=0;d<7;d++) if(ausenciaDe(iso(masDias(L,d)))) n++; return n>=3; }
function sesAus(tipo, s){
  const z=A.zonasFC||[125,155,170,185];
  if(tipo==="cardio") return s.int==="alta"
    ? {ico:"🏃", tipo:"activo", titulo:"Cardio en máquina: intervalos", sub:"Bici estática, elíptica o remo", dur:45, int:"alta",
       obj:"Mantener el motor sin bici: un estímulo intenso corto en la máquina que haya.",
       texto:`10' suave · <b>5 × 4' fuerte</b> (RPE 8, pulso ${z[2]+1}-${z[3]}) con 3' suave · 10' suave.<br>Nada de correr en cinta: sin impacto para el tobillo.`}

// Cambia las sesiones de un día fuera por otras que se puedan hacer (y no manda bici a Garmin)
function adaptarAus(lista, au){
  if(!au) return lista;
  const marca = x => ({...x, aus:au});
  const t=au.tipo;
  if(t==="vacas"||t==="enfermo"||t==="esqui") return [marca({...sesAus(t), id:"aus-"+t})];
  if(t==="gym") return lista.map(s=> s.tipo==="bici" ? marca({...sesAus("cardio",s), id:s.id}) : marca(s));
  if(t==="nada"){ const dura=lista.some(s=>s.tipo==="fuerza"||s.int==="alta");
    return dura ? [marca({...sesAus("hotel"), id:"aus-hotel"})] : lista.length ? [marca({...sesAus("movil"), id:"aus-movil"})] : []; }
  return lista;
}

function aproximacion(W){
  if(typeof W!=="number" || W<40) return [];
  const out=[{kg:20,r:"10"}];
  [[0.4,5],[0.6,3],[0.8,2],[0.9,1]].forEach(([p,r])=>{
    if(p===0.9 && W<80) return;
    const kg=r25(W*p);
    if(kg>20 && kg<W && !out.some(o=>o.kg===kg)) out.push({kg,r:String(r)});
  });
  return out;
}
// Carga prevista de una sesión de bici (para comparar con Strava)
function cargaPlan(s){
  if(!s || s.tipo!=="bici") return null;
  let t=0; s.pasos.forEach(p=>{ const IF=((p.lo+p.hi)/2)/A.ftp; t+=p.reps*p.min/60*IF*IF*100;
    if(p.rec) t+=(p.reps-1)*p.rec/60*Math.pow(p.recW/A.ftp,2)*100; });
  return Math.round(t);
}

    const firma=firmaPlan(x), prev=PLAN[f];

const timers={}, chains={}, pendientes=new Set();

const espera=ms=>new Promise(r=>setTimeout(r,ms));
async function escribir(clave){
  const [tipo,id]=clave.split(":");
  for(let intento=0; intento<5; intento++){
    const now=new Date().toISOString();
    const {error} = tipo==="reg"
      ? await sb.from("registros").upsert({user_id:USER.id, fecha:id, datos:REG[id]||{}, actualizado:now})
      : await sb.from("semanas").upsert({user_id:USER.id, semana:id, datos:EST.semanas[id]||{}, actualizado:now});
    if(!error) return true;
    console.warn("guardar", clave, error);
    if(error.code && /^(42|22|23)/.test(error.code)){ setSync("⚠️ No se pudo guardar: "+error.message,"err"); return false; }
    setSync("⏳ Reintentando guardar…","");
    await espera(1000*Math.pow(2,intento)+Math.random()*500);
  }
  setSync("⚠️ Sin conexión: se guardará al volver","err");
  return false;
}
function persist(clave){
  cacheSave(); pendientes.add(clave); guardarPend(); programarPlan();
  if(!USER) return;
  clearTimeout(timers[clave]);
  timers[clave]=setTimeout(()=>{
    chains[clave]=(chains[clave]||Promise.resolve()).then(()=>escribir(clave)).then(ok=>{
      if(ok){ pendientes.delete(clave); guardarPend(); if(!pendientes.size) setSync("☁️ Guardado","ok"); }
    });
  },600);
}
function reintentarPendientes(){ [...pendientes].forEach(persist); }

    .replace(/\bno (me |te |le )?(ha |han )?(duele|duelen|dolido|molesta|molestan|molestado)\b/g," ")

}

// Tendencia de VFC: media de 7 días (log) frente a tus 60 días anteriores. z = cuántas desviaciones por debajo/encima.

  const ln=k=>{ const o=OURA[iso(masDias(D,-k))]; return o&&o.vfc>0?Math.log(o.vfc):null; };
  const ult=[0,1,2,3,4,5,6].map(ln).filter(x=>x!=null), ant=[]; for(let k=7;k<67;k++){ const x=ln(k); if(x!=null) ant.push(x); }

  const m=a=>a.reduce((x,y)=>x+y,0)/a.length, mb=m(ant), sd=Math.sqrt(m(ant.map(x=>(x-mb)**2)))||0.05, v=m(ult);
  return {z:(v-mb)/sd, v7:Math.round(Math.exp(v)), base:Math.round(Math.exp(mb))};
}
function semaforo(i){

function aprendido(sesId, nombre, f, desde){

  if(!ds.length) return null;

  if(real==null) return null;
  const fb=r.feedback||{}, rpeEj=num(r.rpeEj&&r.rpeEj[nombre]), rpe=rpeEj ?? num(fb.rpe);
  const quien = rpeEj!=null ? `RPE ${fmtKg(rpeEj)}` : (rpe!=null ? `RPE sesión ${fmtKg(rpe)}` : "");
  const base=`La última vez: ${fmtKg(real)} kg${quien?" a "+quien:""}`;

    const b=bloqueDe(lunesDe(new Date(f+"T00:00:00")));
    t.ej.forEach(e=>{
      if(!e.main || typeof e.kg!=="number") return;

      const desde = PROPIO() ? (e.fijar ? A.plan.guardado : A.plan.inicio) : null;
      const a=aprendido(s.id, e.n, f, desde); if(a){ e.kg=a.kg; e.por=a.por; }

    });
    t.ej.forEach(e=>{ if(e.main && typeof e.kg!=="number" && sem.nivel===1) e.s=Math.max(2,e.s-1); });
    if(b.descarga) t.cambios.push("Semana de descarga: −10 % de peso y una serie menos");
    if(sem.nivel===1) t.cambios.push("Una serie menos y −5 % de peso en los ejercicios principales");
    if(sem.extra) t.cambios.push("+2,5 % de peso en los principales");

        if(sem.extra){ p.lo=Math.round(p.lo*1.02); p.hi=Math.round(p.hi*1.02); }
      });
      if(sem.nivel===1 && series) t.cambios.push("Una serie menos y −3 % de vatios");
      if(sem.nivel===1 && !series){ t.pasos[0].min=Math.round(t.pasos[0].min*0.75); t.cambios.push("25 % más corta"); }
      if(sem.extra && series) t.cambios.push("+2 % de vatios en las series");
      t.dur=Math.round(t.pasos.reduce((a,p)=>a+p.reps*p.min+(p.rec?(p.reps-1)*p.rec:0),0));

// Une cada sesión de bici del día con la actividad de Strava de duración más parecida
function emparejar(lista, acts){
  const libres=acts.filter(esBici), out=[];
  lista.forEach((s,k)=>{ if(s.tipo!=="bici"||!libres.length) return;
    let best=-1, d=Infinity; libres.forEach((a,j)=>{ const x=Math.abs((a.duracion_s||0)/60-s.dur)/Math.max(s.dur,1); if(x<d){d=x;best=j;} });
    out[k]=libres.splice(best,1)[0]; });
  return out;
}
const flecha = (dif,tol) => dif>tol?"up":dif<-tol?"down":"ok";
function vsBici(s,a){
  const pMin=s.dur, rMin=(a.duracion_s||0)/60, pC=cargaPlan(s)||0, rC=Math.round(a.carga||0);
  const pIF=pMin?Math.sqrt(pC/(pMin/60)/100):null, w=a.potencia_norm||a.potencia_media, rIF=w?w/A.ftp:null;
  const dD=pMin?rMin/pMin-1:0, dI=rIF&&pIF?rIF-pIF:null;
  const v=[];

    else if(dI<-0.04) v.push(`más suave de lo previsto (${Math.round(rIF*100)} % del FTP frente a ${Math.round(pIF*100)} %)`); }
  if(dD>0.15) v.push(`más larga (+${Math.round(dD*100)} %)`); else if(dD<-0.15) v.push(`más corta (${Math.round(dD*100)} %)`);

  const fila=(n,p,r,c)=>`<tr><td>${n}</td><td class="muted">${p}</td><td class="${c||""}">${r}</td></tr>`;
  return `<div class="cmp"><b>📊 Previsto vs hecho</b> <span class="muted small">· Strava: ${esc(a.nombre||a.tipo)}</span>

    ${fila("Duración", fmtMin(pMin), fmtMin(rMin), flecha(dD,.15))}
    ${fila("Carga (puntos)", pC, rC||"–", pC?flecha(rC/pC-1,.15):"")}
    ${pIF?fila("Intensidad media", Math.round(pIF*A.ftp)+" W · "+Math.round(pIF*100)+" %", w?Math.round(w)+" W · "+Math.round(rIF*100)+" %":"–", dI!=null?flecha(dI,.04):""):""}
    ${a.fc_media?fila("Pulso medio", esZ2&&zf[1]?"≤ "+zf[1]+" ppm":"—", Math.round(a.fc_media)+" ppm"):""}
    </table><div style="margin-top:6px">${txt}</div>${detalleBici(s,a)}</div>`;

const segTxt = x => x<90 ? Math.round(x)+'"' : Math.round(x/60)+"'";
function detalleBici(s,a){
  const d=a.raw&&a.raw.detalle; if(!d) return "";
  const B=d.bloques||[], esZ2=!!(s&&s.pasos&&s.pasos.every(p=>p.z<=2));
  const obj=s&&s.pasos ? s.pasos.filter(p=>p.lo>=A.ftp*.88).sort((x,y)=>y.lo-x.lo)[0] : null;
  const v=[]; let h="";
  if(B.length){
    const enObj=obj?B.filter(b=>b.w>=obj.lo*.98&&b.w<=obj.hi*1.02).length:null;
    h=`<table><tr><td class="muted small">Bloque</td><td class="muted small">Trabajo · vatios</td><td class="muted small">Pulso medio → final</td></tr>`+
      B.map((b,k)=>{ const c=obj?(b.w<obj.lo*.98?"down":b.w>obj.hi*1.02?"up":"ok"):"";
        return `<tr><td>${k+1}</td><td class="${c}">${b.reps>1?b.reps+" × "+segTxt(b.s/b.reps):segTxt(b.s)} · ${b.w} W</td><td>${b.fc?b.fc+" → "+(b.fc_fin||"–")+" ppm":"–"}</td></tr>`; }).join("")+`</table>`;
    if(obj) v.push(enObj===B.length?`<b class="ok">🎯 Vatios clavados:</b> todos los bloques dentro del objetivo (${obj.lo}-${obj.hi} W).`
      : `<b class="up">🎯 Vatios:</b> ${enObj} de ${B.length} bloques dentro del objetivo (${obj.lo}-${obj.hi} W).`);
    const c=B.filter(b=>b.fc);
    if(c.length>=2 && Math.abs(c[c.length-1].w/c[0].w-1)<=.05){
      const dF=c[c.length-1].fc-c[0].fc;
      v.push(dF<=6?`<b class="ok">❤️ Pulso estable:</b> del primer al último bloque solo ${dF>0?"+":""}${dF} ppm con los mismos vatios. Aguantaste bien.`
        : dF<=12?`<b class="ok">❤️ Deriva normal:</b> el pulso subió ${dF} ppm del primer al último bloque con los mismos vatios (fatiga lógica de una sesión dura).`
        : `<b class="up">❤️ Deriva alta:</b> +${dF} ppm del primer al último bloque con los mismos vatios. Puede ser calor, poca bebida o cansancio acumulado: el coach lo tendrá en cuenta.`);
    }
  }
  if(d.desacople!=null && (esZ2 || !B.length)){
    const x=d.desacople;
    v.push(x<5?`<b class="ok">🫀 Desacople ${x} %:</b> el pulso apenas subió para los mismos vatios. Base aeróbica sólida.`
      : x<=8?`<b class="up">🫀 Desacople ${x} %:</b> aceptable; en salidas largas es normal que suba algo. Por debajo de 5 % = base muy sólida.`
      : `<b class="up">🫀 Desacople ${x} %:</b> el pulso se disparó en la 2.ª mitad para los mismos vatios: falta base, calor, poca comida o bebida, o cansancio.`);
  }
  if(!d.con_pulso) v.push(`<b class="up">⚠️ Sin pulso:</b> esta actividad no tiene pulso. Revisa que la banda esté emparejada con el Edge; sin pulso no puedo ver la deriva.`);
  if(!h && !v.length) return "";
  return `<details class="det" open><summary><b>🔍 Por intervalos</b></summary>${h}${v.map(x=>`<div style="margin-top:6px">${x}</div>`).join("")}</details>`;
}
function vsFuerza(s,r,f){

    if(reps&&kgP!=null){ pT+=e.s*reps*kgP; hT+=n*reps*kgR; }

    ${pT?`<tr><td>Kilos movidos</td><td class="muted">${Math.round(pT).toLocaleString("es-ES")} kg</td><td class="${flecha(hT/pT-1,.1)}">${Math.round(hT).toLocaleString("es-ES")} kg</td></tr>`:""}
    ${lin.join("")}</table><div style="margin-top:6px">${v}</div>
    ${!rpes.length?`<p class="muted small" style="margin:6px 0 0">Apunta el RPE de cada ejercicio para que el sistema ajuste mejor los pesos.</p>`:""}</div>`;
}

  if(MP.vid!==id){ MP.vid=id; const caja=document.getElementById("mpvid"); cajaVid(caja, id, "46vh");
    if(MP.yt) MP.yt.cargar(MOV[id].y); else MP.yt=vidPlayer(caja, MOV[id].y, `data-mp="p"`); }
  top.innerHTML=`<div class="row between"><span class="muted small">${MP.k+1>0?MP.k+1:0} / ${P.length} · ${pct} %</span><button class="btn ghost small" data-mp="x">✕ Salir</button></div>
    <div class="bar" style="margin:8px 0 12px"><i style="width:${pct}%"></i></div>`;
  ui.innerHTML=`<div class="muted small" style="text-align:center;margin-top:4px">🎥 ${esc(MOV[id].y[4])}</div>
    <h2 style="margin:6px 0 2px;text-align:center">${e?e.n:"Prepárate: "+MOV[id].n}</h2>
    <div class="muted" style="text-align:center">${p&&p.lado?"Lado "+p.lado:e?"":"Empezamos en…"}</div>
    <div class="mp-t">${MP.left}</div>
    <svg viewBox="0 0 100 6" class="mp-bar"><rect width="100" height="6" rx="3" fill="var(--line)"/><rect width="${Math.max(0,(tot-MP.left)/tot*100)}" height="6" rx="3" fill="var(--accent)"/></svg>
    <ul class="claves" style="margin:12px 0">${MOV[id].k.map(x=>`<li>${x}</li>`).join("")}</ul>
    ${sig?`<div class="mp-sig"><img alt="" src="${ytMini(MOV[sig.id].y)}"><span class="muted small">Siguiente<br><b>${MOV[sig.id].n}</b>${sig.lado?" · "+sig.lado:""}</span></div>`:`<div class="muted small" style="text-align:center">Último ejercicio</div>`}
    <div class="row" style="gap:8px;margin-top:14px"><button class="btn ghost" style="flex:1" data-mp="p">${MP.pausa?"▶️ Seguir":"⏸ Pausa"}</button><button class="btn ghost" style="flex:1" data-mp="s">⏭ Saltar</button></div>`;
}
document.addEventListener("click",e=>{ const b=e.target.closest("[data-mp]"); if(!b||!MP) return;
  if(b.dataset.mp==="x") return movEnd(false);
  if(b.dataset.mp==="p"){ MP.pausa=!MP.pausa; if(MP.yt) MP.yt.pausa(MP.pausa); movPaint(); return; }
  if(b.dataset.mp==="s"){ MP.left=1; if(MP.pausa&&MP.yt) MP.yt.pausa(false); MP.pausa=false; MP.skip=MP.k>=0; movTick(); } });

document.getElementById("nav").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return;
  UI.tab=b.dataset.tab; UI.mover=null; render(); window.scrollTo(0,0); });
function sesionVista(){ const i=UI.dia; return ajustar(fuerzaDia(i)||sesionDe(i), semaforo(i), iso(fecha(i))); }

app.addEventListener("click",async e=>{
  const b=e.target.closest("button,[data-dia],a[data-modo]"); if(!b) return;
  const d=b.dataset, i=UI.dia;
  if(b.id==="entrar"){
    b.disabled=true;
    const {data,error}=await sb.auth.signInWithPassword({email:document.getElementById("lemail").value.trim(), password:document.getElementById("lpass").value});
    if(error){ vLogin("No se pudo entrar: "+error.message); return; }
    USER=data.user; app.innerHTML=`<p class="muted" style="text-align:center;margin-top:40vh">Cargando…</p>`; cargar(); return; }
  if(d.modo){ e.preventDefault(); vLogin("", d.modo==="alta"); return; }
  if(b.id==="registrar"){
    const email=document.getElementById("lemail").value.trim(), pass=document.getElementById("lpass").value;
    if(!document.getElementById("lacepto").checked){ vLogin("Para crear la cuenta tienes que aceptar el uso de tus datos.", true); return; }
    if(pass.length<8){ vLogin("La contraseña necesita al menos 8 caracteres.", true); return; }
    b.disabled=true;
    const {data,error}=await sb.auth.signUp({email, password:pass, options:{emailRedirectTo:location.origin+location.pathname, data:{consentimiento:new Date().toISOString()}}});
    if(error){ vLogin("No se pudo crear la cuenta: "+error.message, true); return; }
    if(!data.session){ vLogin("✉️ Te hemos mandado un email. Abre el enlace para confirmar tu cuenta y vuelve aquí para entrar.", false, true); return; }
    USER=data.user; PERFIL_OK=false; render(); return; }
  if(d.copiar){ const txt=d.copiar==="alta"?textoAlta():textoRevision(); copiar(txt, "txt-"+d.copiar); return; }
  if(d.pegar){ const msg=document.getElementById("pegar-msg"), txt=document.getElementById("pegar-plan").value;
    if(!txt.trim()){ msg.textContent="Primero pega la respuesta de Claude."; return; }
    b.disabled=true; msg.style.color=""; msg.textContent="Guardando…";
    try{ const nuevo=await guardarPlanClaude(txt); PERFIL_OK=true; UI.pegado=""; UI.tab="hoy"; UI.dia=HOY; render(); window.scrollTo(0,0);
      toast(nuevo?"¡Plan guardado! Ya lo tienes en Hoy y Semana":"Plan actualizado"); cargar(); }
    catch(err){ b.disabled=false; msg.style.color="var(--red)"; msg.textContent=err.message; }
    return; }
  if(b.id==="salir"){ await sb.auth.signOut(); USER=null; try{ localStorage.removeItem(CK); localStorage.removeItem(PK); }catch(_){} location.reload(); return; }
  if(d.sc){ const r=tocar(i); r.checkin={...(r.checkin||{}),[d.sc]:+d.v}; saveReg(r.fecha); render(); return; }
  if(d.com){ const s=clone(semana()); s.comodin=d.com; setSemana(s); render(); return; }
  if(d.cu){ document.querySelectorAll("[data-cu]").forEach(x=>x.classList.toggle("on",x===b)); return; }
  if(d.set){ const r=tocar(i); r.sets=r.sets||{}; r.sets[d.set]=!r.sets[d.set]; b.classList.toggle("done"); saveReg(r.fecha); return; }
  if(d.paso!==undefined){
    const ex=sesionVista().ej[+d.paso], r=tocar(i); r.pesos=r.pesos||{};
    const cur=num(r.pesos[ex.n]) ?? ex.kg, nuevo=r25(cur+parseFloat(d.delta));
    if(nuevo===ex.kg) delete r.pesos[ex.n]; else r.pesos[ex.n]=fmtKg(nuevo);
    saveReg(r.fecha); render(); return; }
  if(d.garmin){ b.disabled=true; const ok=await publicarPlan(true); b.disabled=false;
    toast(ok?"Enviado: en 1-2 minutos estará en tu Garmin":"No se pudo enviar. Reintenta en un momento"); render(); return; }
  if(b.id==="guardar"){
    const rpe=num(document.getElementById("rpe").value);
    const cumpl=(document.querySelector("[data-cu].on")||{}).dataset?.cu||"plan";
    const tipo=fuerzaDia(i)?"fuerza":sesionDe(i).tipo;
    let sug;
    if(cumpl==="mas"||rpe>=9) sug="Mañana bajamos un poco la carga para que recuperes.";
    else if(cumpl==="menos") sug="La próxima sesión sube un poco (sin pasarse).";
    else if(rpe!=null && rpe<=7 && tipo==="fuerza") sug="Ha ido bien: la próxima vez sube peso donde el RPE fue bajo.";
    else sug="Todo según lo previsto.";
    const r=tocar(i); r.feedback={rpe:rpe??"", com:document.getElementById("com").value, cumpl, sug};
    if(tipo==="fuerza" && !r.terminada){ r.terminada=new Date().toISOString(); saveReg(r.fecha); render(); toast("Sesión terminada: mira tu resumen arriba"); window.scrollTo({top:0,behavior:"smooth"}); return; }
    saveReg(r.fecha); render(); toast("Feedback guardado"); return; }
  if(b.id==="gpeso"){ const v=document.getElementById("pesoCorp").value.trim(); if(!v) return;
    const f=iso(HOYD), r=REG[f]||(REG[f]={fecha:f}); r.pesoCorporal=v; saveReg(f); render(); toast("Peso guardado"); return; }
  if(d.meso){ UI.meso=d.meso; render(); return; }
  if(d.movdia!==undefined){ UI.dia=+d.movdia; render(); return; }
  if(d.movv){ UI.movV=+d.movv; render(); return; }
  if(d.movgo){ movStart(iso(fecha(i)), UI.movV||8); return; }
  if(d.movvid){ movVerVid(d.movvid); return; }
  if(d.movchk){ const f=iso(fecha(i)), r=REG[f]||(REG[f]={fecha:f}); r.movilidad=r.movilidad||{}; const h=r.movilidad.hechos=r.movilidad.hechos||{};
    if(h[d.movchk]) delete h[d.movchk]; else h[d.movchk]=true; r.movilidad.v=UI.movV||8; r.movilidad.min=minMov(f); saveReg(f); render(); return; }
  if(d.irmov){ UI.tab="movilidad"; render(); window.scrollTo(0,0); return; }
  if(d.ausadd){ const t=document.getElementById("aus-tipo").value, de=document.getElementById("aus-desde").value, ha=document.getElementById("aus-hasta").value||de;
    if(!de || ha<de){ toast("Revisa las fechas"); return; }
    const nota=document.getElementById("aus-nota").value.trim();
    guardarAusencias([...(A.ausencias||[]), {tipo:t, desde:de, hasta:ha, nota}], `Ausencia añadida: ${AUS[t][1]} del ${de} al ${ha}${nota?" · "+nota:""}`); toast("Guardado: el plan se ha adaptado"); return; }
  if(d.ausdel!==undefined){ const l=[...(A.ausencias||[])], x=l.splice(+d.ausdel,1)[0]; guardarAusencias(l, `Ausencia quitada: ${AUS[x.tipo][1]} del ${x.desde} al ${x.hasta}`); toast("Quitado"); return; }
  if(d.resetsem){ const s=PROPIO()?semBase():clone(semana()); if(!PROPIO()){ s.orden=[...DEF_ORDEN]; delete s.segunda; delete s.dias; } setSemana(s); render(); toast("Semana tipo"); return; }
  if(d.mv){ e.stopPropagation(); const [a,b]=d.mv.split("-").map(Number);
    UI.mover=(UI.mover&&UI.mover.i===a&&UI.mover.j===b)?null:{i:a,j:b}; render(); return; }
  if(d.dia!==undefined){
    const k=+d.dia;
    if(UI.mover){
      const {i:o,j}=UI.mover;
      if(o!==k){ const s=clone(semana()), D=diasDe(s).map(x=>[...x]); const [id]=D[o].splice(j,1); D[k].push(id); s.dias=D;
        setSemana(s); toast(`Movido al ${DIAS[k].toLowerCase()}`); }
      UI.mover=null; render(); return; }
    UI.dia=k; UI.tab="hoy"; render(); window.scrollTo(0,0); }
});
app.addEventListener("keydown",e=>{ if(e.key==="Enter" && (e.target.id==="lpass"||e.target.id==="lemail")) document.getElementById("entrar")?.click(); });
app.addEventListener("input",e=>{ const el=e.target; if(el.id==="pegar-plan"){ UI.pegado=el.value; return; } if(el.dataset.rg===undefined) return;
  const x=+el.value, w=el.closest(".barra"); w.classList.remove("vacia"); const b=w.querySelector(".barra-v"); b.textContent=x+" · "+NIVEL[x]; b.dataset.niv=x; });
app.addEventListener("change",e=>{
  const el=e.target, i=UI.dia;
  if(el.dataset.rg!==undefined){ const r=tocar(i); r.checkin={...(r.checkin||{}),[el.dataset.rg]:6-(+el.value)}; saveReg(r.fecha); render(); return; }
  if(el.dataset.peso!==undefined){
    const ex=sesionVista().ej[+el.dataset.peso], r=tocar(i); r.pesos=r.pesos||{};
    const v=el.value.trim();
    if(!v || v===String(ex.kg) || num(v)===ex.kg) delete r.pesos[ex.n]; else r.pesos[ex.n]=v;
    saveReg(r.fecha); renderPend=true; return; }
  if(el.dataset.rpeej!==undefined){
    const ex=sesionVista().ej[+el.dataset.rpeej], r=tocar(i); r.rpeEj=r.rpeEj||{};
    const v=el.value.trim(); if(v) r.rpeEj[ex.n]=v; else delete r.rpeEj[ex.n];
    saveReg(r.fecha); return; }
  if(el.dataset.testmov!==undefined){ const f=iso(HOYD), r=REG[f]||(REG[f]={fecha:f}); r.testMov=r.testMov||{};
    const v=el.value.trim().replace(",","."); if(v) r.testMov[el.dataset.testmov]=v; else delete r.testMov[el.dataset.testmov];
    if(!Object.keys(r.testMov).length) delete r.testMov; saveReg(f); renderPend=true; return; }
  if(el.id==="readiness"||el.id==="sueno"){
    const r=tocar(i); r.checkin={...(r.checkin||{})}; const v=el.value.trim();
    if(v) r.checkin[el.id]=v; else delete r.checkin[el.id];
    saveReg(r.fecha); renderPend=true; return; }
});
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && USER) cargar(); });
window.addEventListener("online",()=>{ if(USER) reintentarPendientes(); });

/* ---------- arranque ---------- */
(async()=>{
  const C=window.COACH_CONFIG||{};
  if(!window.supabase || !C.supabaseUrl || C.supabaseUrl.startsWith("PEGAR")){
    app.innerHTML=`<div class="login"><div class="card"><h3>Falta configurar</h3><p class="muted">Rellena docs/config.js con los datos de Supabase.</p></div></div>`; return; }
  sb=window.supabase.createClient(C.supabaseUrl, C.supabaseAnonKey, {auth:{persistSession:true, autoRefreshToken:true}});
  try{ (JSON.parse(localStorage.getItem(PK))||[]).forEach(p=>pendientes.add(p)); }catch(e){}
  const {data}=await sb.auth.getSession();
  if(!data.session){ vLogin(); return; }
  USER=data.session.user;
  if(cacheLoad()){ construirSesiones(); render(); } else app.innerHTML=`<p class="muted" style="text-align:center;margin-top:40vh">Cargando…</p>`;
  cargar();
})();
</script>
